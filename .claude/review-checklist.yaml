version: 1
checks:
  - id: atom-access-in-state-only
    severity: critical
    rule: Every atom read/update stays in state.ts; other modules call state.ts helpers instead of touching atoms.
    applies_to: plugins/buddy/hooks/**
    tags:
      - buddy
      - validator
    added_by: seed
    added_date: 2026-10-19T00:00:00.000Z
    status: staged
    hit_count: 0
    miss_streak: 1
    last_hit: null
    last_evaluated: '2026-10-19'
  - id: dollar-helpers-top-level
    severity: critical
    rule: Functions that take $ must be declared at module top level, never nested or inline, so the validator can follow them.
    applies_to: plugins/buddy/hooks/**
    tags:
      - buddy
      - validator
    added_by: seed
    added_date: 2026-10-19T00:00:00.000Z
    status: staged
    hit_count: 0
    miss_streak: 1
    last_hit: null
    last_evaluated: '2026-10-19'
  - id: keep-18-species
    severity: critical
    rule: bones.ts must keep exactly the original 18 species; never adopt coding-buddy's 20-species list, which changes every roll.
    applies_to: plugins/buddy/hooks/bones.ts
    tags:
      - buddy
    added_by: seed
    added_date: 2026-10-19T00:00:00.000Z
    status: staged
    hit_count: 0
    miss_streak: 1
    last_hit: null
    last_evaluated: '2026-10-19'
  - id: upsert-preserves-unknown-fields
    severity: critical
    rule: Patching the buddies file must keep every field it does not know; never rewrite the user's file dropping unknown keys.
    applies_to: plugins/buddy/hooks/friends.ts
    tags:
      - buddy
      - data-loss
    added_by: seed
    added_date: 2026-10-19T00:00:00.000Z
    status: staged
    hit_count: 0
    miss_streak: 1
    last_hit: null
    last_evaluated: '2026-10-19'
  - id: claude-json-read-once
    severity: major
    rule: Read ~/.claude.json only inside withOriginal in crew.ts, guarded by the migrated flag; never read it anywhere else.
    applies_to: plugins/buddy/hooks/**
    tags:
      - buddy
    added_by: seed
    added_date: 2026-10-19T00:00:00.000Z
    status: staged
    hit_count: 0
    miss_streak: 1
    last_hit: null
    last_evaluated: '2026-10-19'
  - id: user-lines-in-words
    severity: major
    rule: Put every user-facing line in words.ts in both languages; never hardcode user-facing strings in other modules.
    applies_to: plugins/buddy/hooks/**
    tags:
      - buddy
      - i18n
    added_by: seed
    added_date: 2026-10-19T00:00:00.000Z
    status: staged
    hit_count: 0
    miss_streak: 1
    last_hit: null
    last_evaluated: '2026-10-19'
  - id: register-wires-only
    severity: major
    rule: register.tsx only reads options into one Ctx and wires events; put verb logic in commands.ts and drawing in view.tsx.
