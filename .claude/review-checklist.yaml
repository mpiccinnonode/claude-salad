    hit_count: 0
    miss_streak: 1
    last_hit: null
    last_evaluated: '2026-10-19'
  - id: evolve-all-or-nothing
    severity: major
    rule: Persist an evolution only when both evolve and dreamOn succeed; never write a partial evolution to store or buddies file.
