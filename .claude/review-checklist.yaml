suppressions:
  - id: language-neutral-glyphs
    pattern: Hardcoded '...' and × glyphs flagged under user-lines-in-words
    reason: Language-neutral glyphs need no translation.
    applies_to: plugins/buddy/hooks/**
    added_by: lifecycled-code-review
    added_date: '2026-10-19'
    last_relevant: '2026-10-19'
    status: active
  - id: openbook-env-catch
    pattern: openBook(...).catch fallback and !book.path guard flagged as impossible-case-handling
    reason: Guards $.env.get rejecting at a system boundary.
    applies_to: plugins/buddy/hooks/crew.ts
    added_by: lifecycled-code-review
    added_date: '2026-10-19'
    last_relevant: '2026-10-19'
    status: active
  - id: wag-explicit-default
    pattern: wag(2, 2) flagged as repeating the default slow parameter
    reason: Explicit 2s pair visually with the other wag calls in the rig table.
    applies_to: plugins/buddy/hooks/rigs.ts
    added_by: lifecycled-code-review
    added_date: '2026-10-19'
    last_relevant: '2026-10-19'
    status: active
  - id: typed-plugin-options
    pattern: Numeric plugin options reaching register() as NaN / non-numbers
    reason: Claude Code validates options against plugin.json userConfig types before the hooks module loads; a non-number never reaches register().
    applies_to: plugins/*/hooks/register.tsx
    added_by: lifecycled-code-review
    added_date: '2026-10-19'
    last_relevant: '2026-10-19'
    status: active
project_context:
  - key: buddy-mod-runtime
    context: 'plugins/buddy is a Claude Code mod (function hooks, TSX). Modules import each other as ./x.ts. Checks: `claude plugin validate plugins/buddy` and `claude plugin test plugins/buddy`.'
  - key: buddy-store-is-users
    context: The buddies file and the store are user data; losing or corrupting fields is a data-loss bug.
